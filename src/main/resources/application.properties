spring.application.name=auth-api
server.port=${AUTH_API_PORT:8090}
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${AUTH_DB_PATH:/data/auth.db}
spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
jwt.secret=una-clave-secreta-larga-y-aleatoria-de-al-menos-32-caracteres
jwt.expiration-minutes=60
spring.jackson.time-zone=Europe/Madrid
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${SMTP_FROM:${SMTP_USERNAME}}